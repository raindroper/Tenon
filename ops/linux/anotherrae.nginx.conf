map $request_method$uri $anotherrae_login_key {
    default "";
    "POST/api/auth/login" $binary_remote_addr;
}

limit_req_zone $anotherrae_login_key zone=anotherrae_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name rae.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/anotherrae-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://rae.example.com$request_uri;
    }
}

upstream anotherrae_app {
    server 127.0.0.1:4317;
    keepalive 8;
    keepalive_timeout 2s;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rae.example.com;
    ssl_certificate /etc/letsencrypt/live/rae.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rae.example.com/privkey.pem;

    client_max_body_size 0;
    gzip on;
    gzip_types application/javascript application/json image/svg+xml text/css;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_next_upstream off;

    # The host can publish web assets independently of the running app image.
    # Only the web entry and built assets use this root. All API paths still use the app.
    location ~ ^/(?:index\.html|connector-callback/(?:gmail|outlook)/?)?$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        root /srv/anotherrae-web/public;
        try_files /index.html @anotherrae_app_web;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    }

    location ^~ /assets/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        root /srv/anotherrae-web/public;
        try_files $uri @anotherrae_app_web;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    }

    location @anotherrae_app_web {
        proxy_pass http://anotherrae_app;
    }

    location = /desktop-updates/manifest.json {
        if ($request_method !~ ^(GET|HEAD)$) { return 404; }
        alias /srv/anotherrae-desktop-updates/current/manifest.json;
        types {}
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /desktop-updates/latest.yml {
        if ($request_method !~ ^(GET|HEAD)$) { return 404; }
        alias /srv/anotherrae-desktop-updates/current/latest.yml;
        types {}
        default_type application/yaml;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/desktop-updates/(?<anotherrae_installer>Another-Rae-[0-9]+\.[0-9]+\.[0-9]+-Setup\.exe)$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 404; }
        alias /srv/anotherrae-desktop-updates/current/$anotherrae_installer;
        types {}
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Disposition attachment;
        add_header X-Content-Type-Options nosniff always;
    }

    location /desktop-updates/ {
        return 404;
    }

    location / {
        limit_req zone=anotherrae_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://anotherrae_app;
    }
}
