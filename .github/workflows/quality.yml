name: quality
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - run: npm run prepare:ews
      - run: dotnet build tests/ews-native/EwsChecks.csproj -c Release
      - run: dotnet run --project tests/ews-native/EwsChecks.csproj -c Release --no-build --no-restore
      - run: npm run check
      - run: npm test
      - run: npm run build
      - if: runner.os == 'Windows'
        run: npm run desktop:build
      - if: runner.os == 'Windows'
        run: npm run test:wechat
